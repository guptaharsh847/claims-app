<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add User - Claims Portal</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            primary: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css">

  <meta name="theme-color" content="#4f46e5" />
  <link rel="manifest" href="manifest.json" />
  <script>
    // Redirect to login if not authenticated as ADMIN
    // Checking against hash: X9fK2pL5mQ8jR3t (ADMIN)
    const role = localStorage.getItem("role");
    if (
      role !== "X9fK2pL5mQ8jR3t" &&
      role !== "Z8xL1mP9qR4tK7w" &&
      role !== "ADMIN" &&
      role !== "SUPER_ADMIN"
    ) {
      window.location.replace("login.html");
    }
  </script>
  <style id="page-hider">
    body {
      display: none;
    }
  </style>
</head>

<body
  class="bg-slate-50 min-h-screen flex overflow-hidden font-sans text-slate-900 antialiased selection:bg-indigo-100 selection:text-indigo-700">

  <!-- Decorative Background -->
  <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-indigo-400/20 blur-[100px]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-violet-400/20 blur-[100px]"></div>
  </div>

  <div id="sidebar-placeholder"></div>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <div id="header-placeholder"></div>
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 fade-in">
      <div class="max-w-2xl mx-auto transform transition-all hover:scale-[1.005] duration-500">
        <!-- Form Card -->
        <div
          class="bg-white/80 backdrop-blur-xl rounded-[2rem] shadow-2xl shadow-slate-200/50 border border-white/60 overflow-hidden relative">

          <!-- Header -->
          <div
            class="bg-gradient-to-br from-indigo-600 via-violet-600 to-purple-600 p-8 text-center relative overflow-hidden">
            <div
              class="absolute inset-0 opacity-20 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] mix-blend-overlay">
            </div>
            <div class="relative z-10">
              <h2 class="text-2xl font-bold text-white tracking-tight">Add New User</h2>
              <p class="text-indigo-100 text-sm mt-1 font-medium opacity-90">
                Create a new account for the portal
              </p>
            </div>
          </div>

          <div class="p-8">
            <div class="space-y-6 animate-fade-in delay-100">
              <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Full Name</label>
                <input id="u-name" type="text" placeholder="e.g. John Doe"
                  class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-400 font-medium" />
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                  <label class="block text-sm font-semibold text-slate-700 mb-2">Mobile Number</label>
                  <input id="u-mobile" type="tel" placeholder="e.g. 9876543210"
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-400 font-medium" />
                </div>
                <div>
                  <label class="block text-sm font-semibold text-slate-700 mb-2">Email Address</label>
                  <input id="u-email" type="email" placeholder="e.g. john@example.com"
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-400 font-medium" />
                </div>
              </div>

              <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Password</label>
                <input id="u-password" type="password" placeholder="Enter secure password"
                  class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-400 font-medium" />
              </div>

              <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Role</label>
                <div class="relative">
                  <select id="u-role"
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all appearance-none font-medium cursor-pointer">
                    <option value="USER">USER</option>
                    <option value="ADMIN">ADMIN</option>
                    <option value="SUPER_ADMIN">SUPER_ADMIN</option>
                  </select>
                  <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500">
                    <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 20 20">
                      <path fill-rule="evenodd"
                        d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                        clip-rule="evenodd" />
                    </svg>
                  </div>
                </div>
                <p class="text-xs text-slate-500 mt-2 font-medium">
                  Admins have full access to manage claims and users.
                </p>
              </div>

              <div>
                <label class="block text-sm font-semibold text-slate-700 mb-3">Permissions</label>
                <div
                  class="grid grid-cols-1 sm:grid-cols-3 gap-4 bg-slate-50/50 p-4 rounded-xl border border-slate-200/60">
                  <label class="flex items-center gap-3 cursor-pointer p-2 hover:bg-white rounded-lg transition-colors">
                    <input type="checkbox" id="u-canAddUser"
                      class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 h-5 w-5" />
                    <span class="text-sm font-medium text-slate-700">Add User</span>
                  </label>
                  <label class="flex items-center gap-3 cursor-pointer p-2 hover:bg-white rounded-lg transition-colors">
                    <input type="checkbox" id="u-canManageUser"
                      class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 h-5 w-5" />
                    <span class="text-sm font-medium text-slate-700">Manage User</span>
                  </label>
                  <label class="flex items-center gap-3 cursor-pointer p-2 hover:bg-white rounded-lg transition-colors">
                    <input type="checkbox" id="u-canViewAnalytics"
                      class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 h-5 w-5" />
                    <span class="text-sm font-medium text-slate-700">View Analytics</span>
                  </label>
                </div>
              </div>

              <div class="pt-2">
                <button id="btn-add-user" onclick="addUser()"
                  class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 text-white px-6 py-4 rounded-xl shadow-lg shadow-indigo-500/30 hover:shadow-indigo-500/40 transition font-bold flex justify-center items-center active:scale-[0.98] hover:-translate-y-0.5">
                  Create User Account
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
  <script>
    // Remove SUPER_ADMIN option if current user is not SUPER_ADMIN
    if (Utils.getDecodedRole() !== "SUPER_ADMIN") {
      const opt = document.querySelector('option[value="SUPER_ADMIN"]');
      if (opt) opt.remove();
    }
  </script>
</body>

</html>
