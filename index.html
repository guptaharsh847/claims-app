<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Claims Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            primary: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="css/styles.css">
  <meta name="theme-color" content="#4f46e5">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="manifest" href="manifest.json">
</head>

<body class="bg-slate-50 min-h-screen flex flex-col selection:bg-indigo-100 selection:text-indigo-700 overflow-x-hidden">

  <!-- Decorative Background -->
  <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-indigo-400/20 blur-[100px]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-violet-400/20 blur-[100px]"></div>
  </div>

  <!-- Navbar -->
  <nav class="w-full glass sticky top-0 z-50 border-b border-white/50">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <!-- Logo / Brand -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-violet-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
        </div>
        <span class="font-bold text-xl text-slate-800 tracking-tight">Claims<span class="text-indigo-600">Portal</span></span>
      </div>

      <!-- Login / Admin Button -->
      <a id="auth-btn" href="login.html" class="group flex items-center gap-2 text-sm font-semibold text-slate-600 hover:text-indigo-600 transition-all px-5 py-2.5 rounded-xl hover:bg-indigo-50/80 border border-transparent hover:border-indigo-100">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
        </svg>
        <span>Login</span>
      </a>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col items-center justify-center p-4 sm:p-6 fade-in container mx-auto">
    
    <div class="w-full max-w-lg mx-auto transform transition-all hover:scale-[1.01] duration-500">
      <!-- Hero Card -->
      <div class="bg-white/80 backdrop-blur-xl rounded-[2rem] shadow-2xl shadow-indigo-200/50 border border-white/60 overflow-hidden relative">
        
        <!-- Decorative Header -->
        <div class="bg-gradient-to-br from-indigo-600 via-violet-600 to-purple-600 p-10 text-center relative overflow-hidden">
          
          <!-- Abstract Background Pattern -->
          <div class="absolute inset-0 opacity-20 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] mix-blend-overlay"></div>
          <div class="absolute -top-24 -right-24 w-64 h-64 bg-white/10 rounded-full blur-3xl"></div>
          <div class="absolute -bottom-24 -left-24 w-64 h-64 bg-indigo-900/20 rounded-full blur-3xl"></div>
          
          <div class="relative z-10 animate-fade-in">
             <div class="w-20 h-20 bg-white/10 backdrop-blur-md rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-inner border border-white/20 ring-4 ring-white/5">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white drop-shadow-md" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
             </div>
             <h1 class="text-3xl font-bold text-white mb-2 tracking-tight">Welcome to HELP</h1>
             <p class="text-indigo-100 font-medium opacity-90 text-lg">Claims & Reimbursement Portal</p>
          </div>
        </div>

        <!-- Content Body -->
        <div class="p-8 md:p-10 space-y-8">
          <p class="text-slate-500 text-center text-base leading-relaxed max-w-sm mx-auto animate-fade-in delay-100">
            Streamline your expense reimbursements. Submit new claims, upload receipts, and track approval status in one place.
          </p>

          <div class="space-y-4 animate-fade-in delay-200">
            <a href="claim.html" class="flex items-center justify-center w-full bg-gradient-to-r from-indigo-600 to-violet-600 text-white py-4 px-6 rounded-2xl font-bold hover:shadow-lg hover:shadow-indigo-500/30 transition-all transform hover:-translate-y-1 active:translate-y-0 group relative overflow-hidden">
              <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-3 group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
              </svg>
              <span class="relative">Raise New Claim</span>
            </a>

            <a href="status.html" class="flex items-center justify-center w-full bg-white border-2 border-slate-100 text-slate-700 py-4 px-6 rounded-2xl font-bold hover:border-indigo-200 hover:text-indigo-600 hover:bg-indigo-50/50 transition-all transform hover:-translate-y-1 active:translate-y-0 group">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-3 text-slate-400 group-hover:text-indigo-600 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
              </svg>
              Track Status
            </a>

            <!-- Install Button: Mobile Only -->
            <button id="btn-install" onclick="Utils.installPWA()" class="hidden md:hidden flex items-center justify-center w-full bg-slate-50 text-slate-600 py-4 rounded-2xl font-semibold hover:bg-slate-100 transition-all mt-4 border border-slate-100">
               <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
              </svg>
              Install App
            </button>
          </div>
        </div>
        
        <!-- Footer -->
        <div class="bg-indigo-50/50 p-6 text-center border-t border-indigo-100/50 backdrop-blur-sm">
          <p class="text-xs text-indigo-400 font-medium">© 2026 Claims Portal • HELP Team</p>
        </div>

      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script>
    // Logic for Auth Button
    const role = Utils.getDecodedRole();
    const authBtn = document.getElementById("auth-btn");
    
    if (role === "ADMIN") {
      authBtn.href = "admin.html";
      authBtn.classList.add("text-indigo-600", "bg-indigo-50", "border-indigo-100");
      authBtn.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <span>Admin Dashboard</span>
      `;
    } else if (role === "USER") {
      authBtn.removeAttribute("href");
      authBtn.classList.add("opacity-50", "cursor-default");
      authBtn.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>Logged In</span>
      `;
    }
  </script>
</body>
</html>
