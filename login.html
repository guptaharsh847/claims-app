<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Login - Claims Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            primary: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="css/styles.css">
  <meta name="theme-color" content="#4f46e5">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="manifest" href="manifest.json">
</head>

<body class="bg-slate-50 min-h-screen flex flex-col selection:bg-indigo-100 selection:text-indigo-700 overflow-hidden">

  <!-- Decorative Background -->
  <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-indigo-400/20 blur-[100px]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-violet-400/20 blur-[100px]"></div>
  </div>

  <!-- Navbar -->
  <nav class="w-full glass sticky top-0 z-50 border-b border-white/50 flex-none">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3 group">
        <div
          class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-violet-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-500/30 group-hover:scale-110 transition-transform">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
        </div>
        <span class="font-bold text-xl text-slate-800 tracking-tight">Claims<span
            class="text-indigo-600">Portal</span></span>
      </a>
      <a href="index.html"
        class="flex items-center gap-2 text-sm font-semibold text-slate-600 hover:text-indigo-600 transition-all px-4 py-2 rounded-lg hover:bg-slate-50/50 border border-transparent hover:border-slate-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        <span>Home</span>
      </a>
    </div>
  </nav>

  <main class="flex-1 overflow-y-auto flex items-center justify-center p-4 fade-in">
    <div
      class="bg-white/80 backdrop-blur-xl rounded-[2rem] shadow-2xl shadow-indigo-200/50 border border-white/60 w-full max-w-md overflow-hidden transform transition-all hover:scale-[1.01] duration-500">

      <!-- Header -->
      <div
        class="bg-gradient-to-br from-indigo-600 via-violet-600 to-purple-600 p-8 text-center relative overflow-hidden">
        <div
          class="absolute inset-0 opacity-20 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] mix-blend-overlay">
        </div>
        <div class="relative z-10">
          <h2 id="page-title" class="text-3xl font-bold text-white tracking-tight">Welcome Back</h2>
          <p id="page-desc" class="text-indigo-100 font-medium opacity-90 mt-2">Please login to continue</p>
        </div>
      </div>

      <div class="p-8">
        <!-- Login Form -->
        <form id="login-form" onsubmit="event.preventDefault(); login()" class="animate-fade-in delay-100">
          <div class="space-y-5">
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-2">Mobile Number</label>
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                  </svg>
                </div>
                <input id="mobile" type="tel" placeholder="Enter mobile number" required
                  class="w-full pl-11 pr-4 py-3.5 rounded-xl bg-slate-50 border border-slate-200 focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all font-medium">
              </div>
            </div>

            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-2">Password</label>
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                  </svg>
                </div>
                <input id="password" type="password" placeholder="Enter password" required
                  class="w-full pl-11 pr-4 py-3.5 rounded-xl bg-slate-50 border border-slate-200 focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all font-medium">
              </div>
              <div class="flex justify-end mt-2">
                <a href="#" onclick="showForgot()"
                  class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 hover:underline transition">Forgot
                  Password?</a>
              </div>
            </div>

            <button type="submit"
              class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-indigo-500/30 mt-2 active:scale-[0.98] hover:-translate-y-0.5">
              Login
            </button>
          </div>
        </form>

        <!-- Forgot Password Form -->
        <form id="forgot-form" class="hidden space-y-5 animate-fade-in" onsubmit="event.preventDefault();">

          <!-- Step 1: Mobile -->
          <div id="step-1">
            <label class="block text-sm font-semibold text-slate-700 mb-2">Registered Mobile</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24"
                  stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                </svg>
              </div>
              <input id="reset-mobile" type="tel" placeholder="Enter registered mobile"
                class="w-full pl-11 pr-4 py-3.5 rounded-xl bg-slate-50 border border-slate-200 focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all font-medium">
            </div>

            <button type="button" onclick="requestOtp()"
              class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-indigo-500/30 mt-6 active:scale-[0.98]">
              Send OTP
            </button>
          </div>

          <!-- Step 2: OTP & New Password -->
          <div id="step-2" class="hidden space-y-5">
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-3 text-center">Enter 6-digit OTP</label>
              <div class="flex justify-center gap-2" id="otp-container">
                <input type="text" maxlength="1" inputmode="numeric"
                  class="w-12 h-12 text-center text-xl font-bold border border-slate-300 rounded-xl focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all bg-slate-50 focus:bg-white otp-input" />
                <input type="text" maxlength="1" inputmode="numeric"
                  class="w-12 h-12 text-center text-xl font-bold border border-slate-300 rounded-xl focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all bg-slate-50 focus:bg-white otp-input" />
                <input type="text" maxlength="1" inputmode="numeric"
                  class="w-12 h-12 text-center text-xl font-bold border border-slate-300 rounded-xl focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all bg-slate-50 focus:bg-white otp-input" />
                <input type="text" maxlength="1" inputmode="numeric"
                  class="w-12 h-12 text-center text-xl font-bold border border-slate-300 rounded-xl focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all bg-slate-50 focus:bg-white otp-input" />
                <input type="text" maxlength="1" inputmode="numeric"
                  class="w-12 h-12 text-center text-xl font-bold border border-slate-300 rounded-xl focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all bg-slate-50 focus:bg-white otp-input" />
                <input type="text" maxlength="1" inputmode="numeric"
                  class="w-12 h-12 text-center text-xl font-bold border border-slate-300 rounded-xl focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all bg-slate-50 focus:bg-white otp-input" />
              </div>
              <input type="hidden" id="otp">
              <p class="text-xs text-slate-400 mt-2 text-center font-medium">Check your email for the code</p>
            </div>

            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-2">New Password</label>
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                  </svg>
                </div>
                <input id="new-password" type="password" placeholder="Enter new password"
                  class="w-full pl-11 pr-4 py-3.5 rounded-xl bg-slate-50 border border-slate-200 focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all font-medium">
              </div>
            </div>

            <button type="button" onclick="submitReset()"
              class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-indigo-500/30 mt-2 active:scale-[0.98]">
              Reset Password
            </button>
          </div>

          <div class="text-center pt-2">
            <a href="#" onclick="showLogin()"
              class="text-sm text-slate-500 hover:text-indigo-600 font-semibold transition-colors">Back to Login</a>
          </div>
        </form>

        <div id="msg" class="mt-4 min-h-[20px] text-center text-sm font-medium"></div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>

  <script>
    // OTP Input Logic
    const otpContainer = document.getElementById('otp-container');
    if (otpContainer) {
      const otpInputs = otpContainer.querySelectorAll('.otp-input');
      const hiddenOtp = document.getElementById('otp');

      otpInputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
          e.target.value = e.target.value.replace(/[^0-9]/g, '');
          const val = e.target.value;

          if (val.length === 1 && index < otpInputs.length - 1) {
            otpInputs[index + 1].focus();
          }
          updateHiddenOtp();
        });

        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !e.target.value && index > 0) {
            otpInputs[index - 1].focus();
          }
        });

        input.addEventListener('paste', (e) => {
          e.preventDefault();
          const pasteData = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '').slice(0, 6).split('');
          pasteData.forEach((char, i) => {
            if (otpInputs[i]) otpInputs[i].value = char;
          });
          updateHiddenOtp();
          const lastIndex = Math.min(pasteData.length, otpInputs.length) - 1;
          if (lastIndex >= 0 && lastIndex < otpInputs.length) otpInputs[lastIndex].focus();
        });
      });

      function updateHiddenOtp() {
        let otp = '';
        otpInputs.forEach(input => otp += input.value);
        hiddenOtp.value = otp;
      }
    }
  </script>

</body>

</html>
