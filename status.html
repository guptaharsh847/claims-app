<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>My Claims - Claims Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            primary: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="css/styles.css">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.json">
</head>

<body class="bg-slate-50 min-h-screen flex flex-col selection:bg-indigo-100 selection:text-indigo-700 overflow-hidden">

  <!-- Decorative Background -->
  <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-indigo-400/20 blur-[100px]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-violet-400/20 blur-[100px]"></div>
  </div>

  <!-- Navbar -->
  <nav class="w-full glass sticky top-0 z-50 border-b border-white/50 flex-none">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3 group">
        <div
          class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-violet-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-500/30 group-hover:scale-110 transition-transform">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
        </div>
        <span class="font-bold text-xl text-slate-800 tracking-tight">Claims<span
            class="text-indigo-600">Portal</span></span>
      </a>
      <div class="flex items-center gap-3">
        <a href="index.html" class="text-slate-500 hover:text-indigo-600 transition p-2.5 rounded-xl hover:bg-slate-100"
          title="Go to Home">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
        </a>
        <a href="claim.html"
          class="flex items-center gap-2 bg-gradient-to-r from-indigo-600 to-violet-600 text-white px-5 py-2.5 rounded-xl font-bold hover:shadow-lg hover:shadow-indigo-500/30 transition-all active:scale-95 transform hover:-translate-y-0.5 text-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          New Claim
        </a>
      </div>
    </div>
  </nav>

  <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 fade-in">
    <div class="max-w-6xl mx-auto">
      <!-- Header -->
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
        <div>
          <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Claims History</h1>
          <p class="text-slate-500 mt-1 font-medium">Track the status of your reimbursement requests</p>
        </div>
      </div>

      <!-- Filters Card -->
      <div class="bg-white/80 backdrop-blur-xl rounded-2xl shadow-sm border border-white/60 p-5 mb-8">
        <div class="flex flex-col md:flex-row gap-4 justify-between items-center">

          <!-- Search -->
          <div class="w-full md:w-1/2 flex flex-col sm:flex-row gap-3">
            <div class="relative flex-1">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-slate-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"
                  fill="currentColor">
                  <path fill-rule="evenodd"
                    d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
                    clip-rule="evenodd" />
                </svg>
              </div>
              <input id="searchValue" type="text" placeholder="Search by Email or Claim ID..."
                class="pl-11 w-full border border-slate-200 rounded-xl py-3 focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all text-sm font-medium bg-slate-50 focus:bg-white">
            </div>
            <button onclick="searchClaim()"
              class="bg-slate-800 text-white px-6 py-3 rounded-xl hover:bg-slate-900 transition font-medium text-sm shadow-lg shadow-slate-200 active:scale-95">
              Search
            </button>
          </div>

          <!-- Sort -->
          <div class="flex flex-col md:flex-row gap-3 w-full md:w-auto justify-end">
            <!-- Status Filter -->
            <div class="relative w-full md:w-44">
              <select id="userStatusFilter" onchange="applyUserFilter()"
                class="appearance-none w-full bg-white border border-slate-200 text-slate-700 py-3 pl-4 pr-10 rounded-xl focus:outline-none focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 cursor-pointer shadow-sm text-sm font-medium">
                <option value="">All Statuses</option>
                <option value="Submitted">Submitted</option>
                <option value="Approved">Approved</option>
                <option value="Declined">Declined</option>
                <option value="Reimbursed">Reimbursed</option>
              </select>
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500">
                <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd"
                    d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                    clip-rule="evenodd" />
                </svg>
              </div>
            </div>

            <button onclick="sortClaims('date')"
              class="flex items-center gap-2 px-5 py-3 bg-white border border-slate-200 rounded-xl text-slate-700 hover:border-indigo-500 hover:text-indigo-600 transition-all shadow-sm hover:shadow-md text-sm font-medium group active:scale-95">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-600" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
              Sort By Date
            </button>

            <button onclick="clearUserFilters()"
              class="px-5 py-3 border border-red-200 rounded-xl text-red-600 hover:bg-red-50 transition text-sm font-medium bg-white whitespace-nowrap active:scale-95">
              Clear Filters
            </button>
          </div>
        </div>
      </div>

      <!-- Output Table -->
      <div
        class="bg-white/80 backdrop-blur-xl rounded-2xl shadow-xl shadow-slate-200/50 border border-white/60 overflow-hidden min-h-[300px]">
        <div id="output">
          <!-- JS renders here -->
          <div class="flex flex-col items-center justify-center py-20 text-center">
            <div class="w-24 h-24 rounded-full bg-indigo-50/80 flex items-center justify-center mb-6">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-indigo-600" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
            </div>
            <h3 class="text-xl font-bold text-slate-800 mb-2">Ready to Search</h3>
            <p class="text-slate-500 mb-8 max-w-sm text-base leading-relaxed">
              Enter your email address or claim ID above to view the status of your reimbursement requests.
            </p>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/user.js"></script>
</body>

</html>
