<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Raise Claim</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            primary: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="css/styles.css">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.json">
</head>

<body class="bg-slate-50 min-h-screen flex flex-col selection:bg-indigo-100 selection:text-indigo-700 overflow-hidden">

  <!-- Decorative Background -->
  <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-indigo-400/20 blur-[100px]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-violet-400/20 blur-[100px]"></div>
  </div>

  <!-- Navbar -->
  <nav class="w-full glass sticky top-0 z-50 border-b border-white/50 flex-none">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3 group">
        <div
          class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-violet-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-500/30 group-hover:scale-110 transition-transform">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
        </div>
        <span class="font-bold text-xl text-slate-800 tracking-tight">Claims<span
            class="text-indigo-600">Portal</span></span>
      </a>
      <div class="flex items-center gap-3">
        <a href="index.html" class="text-slate-500 hover:text-indigo-600 transition p-2.5 rounded-xl hover:bg-slate-100"
          title="Go to Home">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
        </a>
        <a href="status.html"
          class="text-sm font-bold text-slate-600 hover:text-indigo-600 transition-colors bg-white/50 px-4 py-2 rounded-lg border border-white/60 hover:bg-white hover:shadow-sm">My
          Claims</a>
      </div>
    </div>
  </nav>

  <main class="flex-1 overflow-y-auto p-4 sm:p-6 fade-in">
    <div class="max-w-3xl mx-auto transform transition-all hover:scale-[1.005] duration-500">
      <div
        class="bg-white/80 backdrop-blur-xl rounded-[2rem] shadow-2xl shadow-indigo-200/50 border border-white/60 overflow-hidden relative">

        <!-- Header -->
        <div
          class="bg-gradient-to-br from-indigo-600 via-violet-600 to-purple-600 p-8 text-center relative overflow-hidden">
          <div
            class="absolute inset-0 opacity-20 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] mix-blend-overlay">
          </div>
          <div class="relative z-10">
            <h2 class="text-2xl font-bold text-white tracking-tight">New Expense Claim</h2>
            <p class="text-indigo-100 text-sm mt-1 font-medium opacity-90">Fill in the details below to submit a request
            </p>
          </div>
        </div>

        <div class="p-8">
          <form id="claimForm" class="space-y-6 animate-fade-in delay-100">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Full Name <span
                    class="text-red-500">*</span></label>
                <input name="name" placeholder="Enter full name" required
                  class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-400 font-medium" />
              </div>

              <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Email Address <span
                    class="text-red-500">*</span></label>
                <input name="email" type="email" placeholder="Enter email address" required
                  class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-400 font-medium" />
              </div>

              <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Base / Department <span
                    class="text-red-500">*</span></label>
                <div class="relative">
                  <select name="department" required
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all appearance-none font-medium cursor-pointer">
                    <option value="" disabled selected>Select Base</option>
                    <option value="Ritudvipa">Ritudvipa</option>
                    <option value="Antardvipa">Antardvipa</option>
                    <option value="Others">Others</option>
                  </select>
                  <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-slate-500">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20">
                      <path
                        d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                        clip-rule="evenodd" fill-rule="evenodd"></path>
                    </svg>
                  </div>
                </div>
              </div>

              <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Expense Date <span
                    class="text-red-500">*</span></label>
                <input name="date" type="date" required
                  class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all text-slate-600 font-medium cursor-pointer" />
              </div>

              <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Claim Type <span
                    class="text-red-500">*</span></label>
                <div class="relative">
                  <select name="type" required
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all appearance-none font-medium cursor-pointer">
                    <option value="" disabled selected>Select Type</option>
                    <option value="Regular">Regular</option>
                    <option value="Advance">Advance</option>
                  </select>
                  <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-slate-500">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20">
                      <path
                        d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                        clip-rule="evenodd" fill-rule="evenodd"></path>
                    </svg>
                  </div>
                </div>
              </div>

              <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Amount (₹) <span
                    class="text-red-500">*</span></label>
                <div class="relative">
                  <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-500 font-bold">₹</span>
                  <input name="amount" type="number" placeholder="0.00" required
                    class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-400 font-medium" />
                </div>
              </div>

              <div class="md:col-span-2">
                <label class="block text-sm font-semibold text-slate-700 mb-2">UPI ID <span
                    class="text-red-500">*</span></label>
                <input name="upiId" type="text" placeholder="e.g. user@upi" required
                  class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-400 font-medium" />
              </div>
            </div>

            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-2">Description</label>
              <textarea name="description" rows="3" placeholder="Enter details about the expense..."
                class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-400 font-medium resize-none"></textarea>
            </div>

            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-2">Receipt / Proof</label>
              <input type="file" id="receiptFile" name="receipt" class="hidden" accept="image/*,application/pdf">
              <label for="receiptFile"
                class="flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-slate-300 rounded-2xl cursor-pointer bg-slate-50 hover:bg-indigo-50 hover:border-indigo-400 transition-all group relative overflow-hidden">
                <div class="absolute inset-0 bg-indigo-500/5 opacity-0 group-hover:opacity-100 transition-opacity">
                </div>
                <div class="flex flex-col items-center justify-center pt-5 pb-6 relative z-10">
                  <div
                    class="w-12 h-12 rounded-full bg-white shadow-sm flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
                    <svg class="w-6 h-6 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                      xmlns="http://www.w3.org/2000/svg">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12">
                      </path>
                    </svg>
                  </div>
                  <p class="mb-1 text-sm text-slate-600 font-medium"><span
                      class="text-indigo-600 font-bold hover:underline">Click to upload</span> or drag and drop</p>
                  <p class="text-xs text-slate-400">PDF, PNG, JPG (Max 10MB)</p>
                </div>
              </label>
              <p id="fileName"
                class="text-sm text-indigo-600 text-center font-semibold mt-3 min-h-[20px] animate-fade-in"></p>
            </div>

            <button type="submit"
              class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 text-white py-4 rounded-xl font-bold hover:shadow-lg hover:shadow-indigo-500/30 transition-all active:scale-[0.98] hover:-translate-y-0.5 mt-2">
              Submit Claim
            </button>

            <p id="result" class="text-center mt-4 text-sm font-medium min-h-[20px]"></p>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/user.js"></script>

</body>

</html>
