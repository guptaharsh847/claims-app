<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics - Claims Portal</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            primary: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css">

  <meta name="theme-color" content="#4f46e5" />
  <link rel="manifest" href="manifest.json" />
  <script>
    const role = localStorage.getItem("role");
    if (
      role !== "X9fK2pL5mQ8jR3t" &&
      role !== "Z8xL1mP9qR4tK7w" &&
      role !== "ADMIN" &&
      role !== "SUPER_ADMIN"
    ) {
      window.location.replace("login.html");
    }
  </script>
  <style id="page-hider">
    body {
      display: none;
    }
  </style>
</head>

<body
  class="bg-slate-50 min-h-screen flex overflow-hidden font-sans text-slate-900 antialiased selection:bg-indigo-100 selection:text-indigo-700">

  <!-- Decorative Background -->
  <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-indigo-400/20 blur-[100px]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-violet-400/20 blur-[100px]"></div>
  </div>

  <div id="sidebar-placeholder"></div>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <div id="header-placeholder"></div>
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 fade-in">
      <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
          <div>
            <h1 class="text-3xl font-bold text-slate-800 tracking-tight">
              Advanced Analytics
            </h1>
            <p class="text-slate-500 mt-1 font-medium">
              Deep dive into claim statistics and trends
            </p>
          </div>
          <div class="flex items-center gap-3">
            <!-- Date Filter -->
            <div class="relative">
              <select id="dateRange" onchange="updateAnalytics()"
                class="appearance-none bg-white border border-slate-200 text-slate-700 py-2.5 pl-4 pr-10 rounded-xl focus:outline-none focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 shadow-sm text-sm font-medium cursor-pointer">
                <option value="7days">Last 7 Days</option>
                <option value="30days">Last 30 Days</option>
                <option value="thisMonth" selected>This Month</option>
                <option value="lastMonth">Last Month</option>
                <option value="thisYear">This Year</option>
                <option value="lastYear">Last Year</option>
                <option value="all">All Time</option>
              </select>
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500">
                <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd"
                    d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                    clip-rule="evenodd" />
                </svg>
              </div>
            </div>
          </div>
        </div>

        <!-- Loading State -->
        <div id="loading" class="flex flex-col items-center justify-center py-20">
          <div class="animate-spin rounded-full h-12 w-12 border-4 border-indigo-100 border-t-indigo-600 mb-4"></div>
          <p class="text-indigo-600 font-bold animate-pulse">
            Crunching numbers...
          </p>
        </div>

        <!-- Content (Hidden initially) -->
        <div id="analytics-content" class="hidden space-y-6">
          <!-- KPI Cards -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <div
              class="bg-white/60 backdrop-blur-md p-6 rounded-2xl border border-white/50 shadow-lg shadow-slate-200/50 hover:transform hover:scale-[1.02] transition-all duration-300">
              <div class="flex items-center justify-between mb-4">
                <div class="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center text-blue-600">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                  </svg>
                </div>
                <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded-lg">+12%</span>
              </div>
              <p class="text-sm font-semibold text-slate-500">Total Claims</p>
              <h3 id="kpi-total" class="text-3xl font-bold text-slate-800 mt-1">
                -
              </h3>
            </div>

            <div
              class="bg-white/60 backdrop-blur-md p-6 rounded-2xl border border-white/50 shadow-lg shadow-slate-200/50 hover:transform hover:scale-[1.02] transition-all duration-300">
              <div class="flex items-center justify-between mb-4">
                <div class="w-10 h-10 rounded-xl bg-indigo-50 flex items-center justify-center text-indigo-600">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                </div>
              </div>
              <p class="text-sm font-semibold text-slate-500">Total Amount</p>
              <h3 id="kpi-amount" class="text-3xl font-bold text-indigo-600 mt-1">
                -
              </h3>
            </div>

            <div
              class="bg-white/60 backdrop-blur-md p-6 rounded-2xl border border-white/50 shadow-lg shadow-slate-200/50 hover:transform hover:scale-[1.02] transition-all duration-300">
              <div class="flex items-center justify-between mb-4">
                <div class="w-10 h-10 rounded-xl bg-emerald-50 flex items-center justify-center text-emerald-600">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                </div>
                <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded-lg">High</span>
              </div>
              <p class="text-sm font-semibold text-slate-500">Approval Rate</p>
              <h3 id="kpi-rate" class="text-3xl font-bold text-emerald-600 mt-1">
                -
              </h3>
            </div>

            <div
              class="bg-white/60 backdrop-blur-md p-6 rounded-2xl border border-white/50 shadow-lg shadow-slate-200/50 hover:transform hover:scale-[1.02] transition-all duration-300">
              <div class="flex items-center justify-between mb-4">
                <div class="w-10 h-10 rounded-xl bg-orange-50 flex items-center justify-center text-orange-500">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                </div>
                <span class="text-xs font-bold text-orange-600 bg-orange-50 px-2 py-1 rounded-lg">Action Req</span>
              </div>
              <p class="text-sm font-semibold text-slate-500">Pending Action</p>
              <h3 id="kpi-pending" class="text-3xl font-bold text-orange-500 mt-1">
                -
              </h3>
            </div>
          </div>

          <!-- Charts Row -->
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Status Distribution -->
            <div
              class="bg-white/80 backdrop-blur-xl p-6 rounded-2xl border border-white/60 shadow-xl shadow-slate-200/40">
              <h3 class="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2">
                <span class="w-1.5 h-6 bg-indigo-500 rounded-full"></span>
                Claims by Status
              </h3>
              <div class="relative h-72 w-full">
                <canvas id="statusChart"></canvas>
              </div>
            </div>

            <!-- Trend Line -->
            <div
              class="bg-white/80 backdrop-blur-xl p-6 rounded-2xl border border-white/60 shadow-xl shadow-slate-200/40">
              <h3 class="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2">
                <span class="w-1.5 h-6 bg-violet-500 rounded-full"></span>
                Submission Trend
              </h3>
              <div class="relative h-72 w-full">
                <canvas id="trendChart"></canvas>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/admin.js"></script>
</body>

</html>
